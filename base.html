<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MEME ARCHIVE{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090b10;
            --bg-card: #111520;
            --bg-elevated: #171c2b;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent: #7c5cff;
            --accent-hover: #6846f5;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 0%, rgba(124, 92, 255, 0.14), transparent 35%),
                radial-gradient(circle at 85% 10%, rgba(34, 211, 238, 0.09), transparent 35%),
                var(--bg-main);
            color: #f3f5f9;
        }

        .glass-nav {
            background: rgba(9, 11, 16, 0.82);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            letter-spacing: 0.06em;
            font-size: 1.05rem;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c5cff, #22d3ee);
            box-shadow: 0 0 14px rgba(124, 92, 255, 0.8);
        }

        .panel-box {
            background: rgba(17, 21, 32, 0.86);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
        }

        .meme-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }

        .meme-card:hover {
            transform: translateY(-5px);
            border-color: rgba(124, 92, 255, 0.45);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
        }

        .meme-media-wrap {
            position: relative;
            height: 235px;
            background: #0d1018;
            overflow: hidden;
        }

        .meme-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .meme-card:hover .meme-media {
            transform: scale(1.03);
        }

        .media-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(9, 11, 16, 0.78);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #e2e8f0;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .year-pill {
            background: rgba(124, 92, 255, 0.18);
            color: #b8a6ff;
            border: 1px solid rgba(124, 92, 255, 0.35);
            font-weight: 600;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.78rem;
            white-space: nowrap;
        }

        .category-pill {
            background: rgba(34, 211, 238, 0.12);
            color: #67e8f9;
            border: 1px solid rgba(34, 211, 238, 0.25);
            font-weight: 500;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 0.75rem;
            display: inline-block;
        }

        .btn-accent {
            background: var(--accent);
            border: none;
            color: #fff;
            font-weight: 600;
        }

        .btn-accent:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        .form-control, .form-select {
            background-color: var(--bg-elevated);
            border-color: var(--border-subtle);
            color: #f3f5f9;
            border-radius: 12px;
            padding: 0.6rem 0.85rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--bg-elevated);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(124, 92, 255, 0.2);
        }

        .btn {
            border-radius: 11px;
        }
    </style>
</head>
<body>
    <nav class="navbar glass-nav sticky-top mb-4 py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-white brand-mark m-0" href="{% url 'meme_list' %}">
                <span class="brand-dot"></span>
                <span>MEME ARCHIVE</span>
            </a>
            <div class="d-flex gap-2">
                <a class="btn btn-accent btn-sm px-3 py-2" href="{% url 'meme_create' %}">+ Добавить мем</a>
                <a class="btn btn-outline-secondary btn-sm px-3 py-2 text-light" href="/admin/">Админ-панель</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
