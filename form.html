{% extends 'memes/base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<a href="{% url 'meme_list' %}" class="btn btn-outline-secondary text-light mb-4">← Назад</a>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="panel-box p-4 p-md-5">
            <h1 class="h3 fw-bold mb-4">{{ page_title }}</h1>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label small text-secondary">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-accent px-4">{{ submit_text }}</button>
                    <a href="{% url 'meme_list' %}" class="btn btn-outline-secondary text-light">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
